# =============================================================================
# docker-compose.prod.yml — 生产环境（无热重载、资源限制）
# =============================================================================
#
# 启动: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
services:
  backend:
    restart: always
    environment:
      LOG_LEVEL: "WARNING"
      ENVIRONMENT: "production"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
